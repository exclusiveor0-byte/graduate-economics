<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IS–LM 재정충격과 단기 균형</title>
  <style>
    :root {
      --ink: #3f3129;
      --muted: #725f54;
      --paper: #fffaf2;
      --panel: #f5eadc;
      --rule: #dfcdb8;
      --terra: #954f2d;
      --plum: #725b70;
      --teal: #087e8b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 1rem;
      background: var(--paper);
      color: var(--ink);
      font: 16px/1.55 system-ui, "Noto Sans KR", -apple-system, sans-serif;
    }
    h1 {
      margin: 0;
      font: 600 1.3rem Georgia, "Noto Serif KR", serif;
    }
    .lede {
      margin: .3rem 0 .8rem;
      color: var(--muted);
      font-size: .9rem;
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(13rem, .75fr) minmax(0, 1.45fr);
      gap: .8rem;
    }
    .panel {
      margin: 0;
      padding: .8rem;
      border: 1px solid var(--rule);
      background: #fffdf9;
    }
    .controls {
      display: grid;
      gap: .65rem;
    }
    .presets {
      display: flex;
      gap: .4rem;
      margin-bottom: .3rem;
    }
    .preset-btn {
      flex: 1;
      padding: .35rem .5rem;
      border: 1px solid var(--rule);
      border-radius: 4px;
      background: var(--panel);
      color: var(--ink);
      font-size: .78rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s ease;
    }
    .preset-btn:hover {
      background: #ebd8c2;
    }
    label {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: .2rem;
      font-size: .8rem;
      font-weight: 700;
    }
    output {
      color: var(--terra);
      font-variant-numeric: tabular-nums;
    }
    input[type="range"] {
      grid-column: 1 / -1;
      width: 100%;
      accent-color: var(--terra);
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: .55rem;
      margin-top: .8rem;
    }
    .metric {
      padding: .55rem;
      border-top: 3px solid var(--plum);
      background: #f5eef3;
    }
    .metric strong {
      display: block;
      color: var(--plum);
      font-size: .69rem;
    }
    .metric span {
      display: block;
      margin-top: .2rem;
      font-size: 1.05rem;
      font-variant-numeric: tabular-nums;
    }
    svg {
      display: block;
      width: 100%;
      height: auto;
    }
    .box {
      fill: #fffdf9;
      stroke: var(--ink);
      stroke-width: 2;
    }
    .guide {
      stroke: #dfcdb8;
      stroke-width: 1;
      stroke-dasharray: 4 5;
    }
    .proj {
      stroke: var(--muted);
      stroke-width: 1.2;
      stroke-dasharray: 4 4;
    }
    .is-initial {
      stroke: #bda89b;
      stroke-width: 1.8;
      stroke-dasharray: 6 5;
    }
    .is-current {
      stroke: var(--terra);
      stroke-width: 3;
    }
    .lm-curve {
      stroke: var(--plum);
      stroke-width: 3;
    }
    .point-initial {
      fill: var(--ink);
    }
    .point-current {
      fill: var(--plum);
    }
    .label {
      font: 12px system-ui;
      fill: var(--ink);
    }
    .muted-label {
      fill: var(--muted);
    }
    .formula {
      margin: .75rem 0 0;
      padding: .6rem .75rem;
      border-left: 3px solid var(--terra);
      background: #fbf5ef;
      font-family: Georgia, serif;
      font-size: .83rem;
      line-height: 1.45;
    }
    @media (max-width: 720px) {
      body { padding: .7rem; }
      .layout { grid-template-columns: 1fr; }
      .metrics { grid-template-columns: repeat(2, 1fr); }
      .metric { font-size: .83rem; }
    }
  </style>
</head>
<body>
  <h1>IS–LM 재정충격과 단기 균형</h1>
  <p class="lede">재정지출 충격 G를 변경하며 IS 곡선의 우측 이동과 단기 균형 산출·이자율의 변화를 확인하세요.</p>

  <div class="layout">
    <section class="panel controls" aria-label="모수 조절">
      <div class="presets">
        <button type="button" class="preset-btn" id="btn-init">기준 상태 (G=0)</button>
        <button type="button" class="preset-btn" id="btn-shock">충격 상태 (G=24)</button>
      </div>
      <label>재정지출 충격 G <output id="g-out"></output><input id="g-input" type="range" min="0" max="30" step="1" value="24"></label>
      <label>독립수요 A <output id="a-out"></output><input id="a-input" type="range" min="110" max="150" step="2" value="130"></label>
      <label>실질통화량 m <output id="m-out"></output><input id="m-input" type="range" min="30" max="55" step="1" value="42"></label>
      <label>IS 이자율 민감도 b <output id="b-out"></output><input id="b-input" type="range" min="5" max="15" step="0.5" value="9"></label>

      <p class="formula">
        <strong>IS:</strong> r = (A + G − Y) / b<br>
        <strong>LM:</strong> r = (kY − m) / h &nbsp;(k=0.5, h=8)<br>
        <strong>재정승수:</strong> dY/dG = h / (h + bk)
      </p>
    </section>

    <section class="panel" aria-label="IS-LM 도표">
      <svg id="chart" viewBox="0 0 710 480" role="img" aria-labelledby="chartTitle chartDesc">
        <title id="chartTitle">IS-LM 재정충격과 균형 이동 도표</title>
        <desc id="chartDesc">가로축은 산출 Y (70~160), 세로축은 이자율 r (0~4.5). 재정지출 확대에 따라 IS 곡선이 우측 이동하며 균형점이 이동한다.</desc>
        <rect class="box" x="78" y="35" width="564" height="390"/>
        <g id="grid"></g>
        <line id="is-init" class="is-initial"/>
        <line id="is-curr" class="is-current"/>
        <line id="lm-line" class="lm-curve"/>
        <g id="projections"></g>
        <circle id="dot-init" class="point-initial" r="6"/>
        <circle id="dot-curr" class="point-current" r="7"/>
        <g id="labels" class="label"></g>
      </svg>

      <div class="metrics" aria-label="균형 결과">
        <div class="metric"><strong>균형 산출 Y*</strong><span id="y-val"></span></div>
        <div class="metric"><strong>균형 이자율 r*</strong><span id="r-val"></span></div>
        <div class="metric"><strong>재정승수 dY/dG</strong><span id="mult-val"></span></div>
        <div class="metric"><strong>산출 변화량 ΔY</strong><span id="dy-val"></span></div>
      </div>
    </section>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const k = 0.5, h = 8;
    const Y_MIN = 70, Y_MAX = 160, R_MIN = 0, R_MAX = 4.5;
    const L = 78, W = 564, T = 35, H = 390, B = T + H;

    const sx = y => L + (y - Y_MIN) / (Y_MAX - Y_MIN) * W;
    const sy = r => B - (r - R_MIN) / (R_MAX - R_MIN) * H;
    const fmt = (n, d = 2) => Number(n).toFixed(d);

    function render() {
      const G = +$('g-input').value;
      const A = +$('a-input').value;
      const m = +$('m-input').value;
      const b = +$('b-input').value;

      $('g-out').textContent = G.toFixed(0);
      $('a-out').textContent = A.toFixed(0);
      $('m-out').textContent = m.toFixed(0);
      $('b-out').textContent = b.toFixed(1);

      // Initial equilibrium (G=0)
      const Y0 = (h * A + b * m) / (h + b * k);
      const r0 = (k * Y0 - m) / h;

      // Current equilibrium
      const Y_star = (h * (A + G) + b * m) / (h + b * k);
      const r_star = (k * Y_star - m) / h;

      // Multipliers
      const mult = h / (h + b * k);
      const deltaY = Y_star - Y0;

      // Update metrics
      $('y-val').textContent = fmt(Y_star);
      $('r-val').textContent = fmt(r_star);
      $('mult-val').textContent = fmt(mult, 3);
      $('dy-val').textContent = (deltaY >= 0 ? '+' : '') + fmt(deltaY);

      // Grid lines
      let grid = '';
      for (let y = 80; y <= 150; y += 20) {
        grid += `<line class="guide" x1="${sx(y)}" y1="${sy(R_MIN)}" x2="${sx(y)}" y2="${sy(R_MAX)}"/>`;
      }
      for (let r = 1; r <= 4; r += 1) {
        grid += `<line class="guide" x1="${sx(Y_MIN)}" y1="${sy(r)}" x2="${sx(Y_MAX)}" y2="${sy(r)}"/>`;
      }
      $('grid').innerHTML = grid;

      // LM Curve: r = (k*Y - m) / h
      const yLM_left = Y_MIN;
      const rLM_left = (k * yLM_left - m) / h;
      const yLM_right = Y_MAX;
      const rLM_right = (k * yLM_right - m) / h;
      $('lm-line').setAttribute('x1', sx(yLM_left));
      $('lm-line').setAttribute('y1', sy(rLM_left));
      $('lm-line').setAttribute('x2', sx(yLM_right));
      $('lm-line').setAttribute('y2', sy(rLM_right));

      // Initial IS Curve (G=0): r = (A - Y) / b
      const rIS0_left = (A - Y_MIN) / b;
      const rIS0_right = (A - Y_MAX) / b;
      $('is-init').setAttribute('x1', sx(Y_MIN));
      $('is-init').setAttribute('y1', sy(rIS0_left));
      $('is-init').setAttribute('x2', sx(Y_MAX));
      $('is-init').setAttribute('y2', sy(rIS0_right));

      // Current IS Curve (G): r = (A + G - Y) / b
      const rIS_left = (A + G - Y_MIN) / b;
      const rIS_right = (A + G - Y_MAX) / b;
      $('is-curr').setAttribute('x1', sx(Y_MIN));
      $('is-curr').setAttribute('y1', sy(rIS_left));
      $('is-curr').setAttribute('x2', sx(Y_MAX));
      $('is-curr').setAttribute('y2', sy(rIS_right));

      // Dots
      $('dot-init').setAttribute('cx', sx(Y0));
      $('dot-init').setAttribute('cy', sy(r0));
      $('dot-curr').setAttribute('cx', sx(Y_star));
      $('dot-curr').setAttribute('cy', sy(r_star));

      // Projection lines from current equilibrium
      $('projections').innerHTML = `
        <line class="proj" x1="${sx(Y_star)}" y1="${sy(r_star)}" x2="${sx(Y_star)}" y2="${B}"/>
        <line class="proj" x1="${sx(Y_star)}" y1="${sy(r_star)}" x2="${L}" y2="${sy(r_star)}"/>
      `;

      // Labels
      let labels = '';
      // Axis labels
      labels += `<text class="muted-label" x="${L}" y="${B + 22}">Y=70</text>`;
      labels += `<text class="muted-label" x="${sx(100)}" y="${B + 22}">100</text>`;
      labels += `<text class="muted-label" x="${sx(130)}" y="${B + 22}">130</text>`;
      labels += `<text class="muted-label" x="${L + W - 32}" y="${B + 22}">160</text>`;
      labels += `<text x="${L + W / 2 - 25}" y="${B + 25}" font-weight="700">산출 Y</text>`;

      labels += `<text class="muted-label" x="${L - 32}" y="${sy(0) + 4}">0</text>`;
      labels += `<text class="muted-label" x="${L - 32}" y="${sy(2) + 4}">2.0</text>`;
      labels += `<text class="muted-label" x="${L - 32}" y="${sy(4) + 4}">4.0</text>`;
      labels += `<text x="${L - 42}" y="${T - 10}" font-weight="700">이자율 r</text>`;

      // Curve names
      labels += `<text x="${sx(145)}" y="${sy(rLM_right) - 10}" fill="#725b70" font-weight="700">LM</text>`;
      labels += `<text x="${sx(74)}" y="${sy(rIS_left) - 10}" fill="#954f2d" font-weight="700">IS (G=${G})</text>`;
      if (G > 0) {
        labels += `<text class="muted-label" x="${sx(74)}" y="${sy(rIS0_left) + 18}">IS (G=0)</text>`;
      }

      // Point labels
      labels += `<text class="muted-label" x="${sx(Y0) - 24}" y="${sy(r0) - 12}">E₀(${fmt(Y0, 1)}, ${fmt(r0, 1)})</text>`;
      labels += `<text fill="#725b70" font-weight="700" x="${sx(Y_star) + 10}" y="${sy(r_star) - 10}">E*(${fmt(Y_star, 1)}, ${fmt(r_star, 1)})</text>`;

      $('labels').innerHTML = labels;
    }

    ['g-input', 'a-input', 'm-input', 'b-input'].forEach(id => {
      $(id).addEventListener('input', render);
    });

    $('btn-init').addEventListener('click', () => {
      $('g-input').value = 0;
      render();
    });

    $('btn-shock').addEventListener('click', () => {
      $('g-input').value = 24;
      render();
    });

    render();
  </script>
</body>
</html>
