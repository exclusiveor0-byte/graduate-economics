<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>도구변수와 약한 도구변수</title>
  <style>
    :root{--ink:#3f3129;--muted:#725f54;--paper:#fffaf2;--panel:#f5eadc;--rule:#dfcdb8;--terra:#954f2d;--plum:#725b70}*{box-sizing:border-box}body{margin:0;padding:1rem;background:var(--paper);color:var(--ink);font:16px/1.55 system-ui,"Noto Sans KR",sans-serif}h1{margin:0;font:600 1.3rem Georgia,"Noto Serif KR",serif}.lede{margin:.3rem 0 .8rem;color:var(--muted);font-size:.9rem}.controls,.metrics,.charts{display:grid;gap:.7rem}.controls,.metrics{grid-template-columns:repeat(4,minmax(0,1fr))}.controls{padding:.85rem;border:1px solid var(--rule);background:var(--panel)}label{display:grid;gap:.2rem;font-size:.77rem;font-weight:700}output{color:var(--terra);font-variant-numeric:tabular-nums}input{width:100%;accent-color:var(--terra)}.metrics{margin:.8rem 0}.metric{padding:.65rem;border-top:3px solid var(--plum);background:#f5eef3}.metric strong{display:block;color:var(--plum);font-size:.7rem}.metric span{display:block;margin-top:.2rem;font-size:1.04rem;font-variant-numeric:tabular-nums}.charts{grid-template-columns:1fr 1fr}figure{margin:0;padding:.6rem;border:1px solid var(--rule);background:#fffdf9}canvas{display:block;width:100%;height:auto}figcaption{margin:.3rem .1rem 0;color:var(--muted);font-size:.74rem}.formula{margin:.8rem 0 0;padding:.65rem .8rem;border-left:3px solid var(--terra);background:#f8efe5;font-family:Georgia,serif}@media(max-width:720px){body{padding:.7rem}.controls,.metrics{grid-template-columns:1fr 1fr}.charts{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <h1>도구변수와 약한 도구변수</h1><p class="lede">내생성 편향과 도구변수 강도에 따른 OLS·2SLS의 표본분포를 비교하세요.</p>
  <section class="controls" aria-label="모수 조절">
    <label>표본 수 n <output id="n-value"></output><input id="n" type="range" min="50" max="400" step="10" value="150"></label>
    <label>참 기울기 beta <output id="beta-value"></output><input id="beta" type="range" min="0.5" max="2" step="0.1" value="1"></label>
    <label>도구 강도 pi <output id="pi-value"></output><input id="pi" type="range" min="0.05" max="1.2" step="0.05" value="0.7"></label>
    <label>내생성 rho <output id="rho-value"></output><input id="rho" type="range" min="0" max="0.9" step="0.1" value="0.6"></label>
  </section>
  <section class="metrics" aria-label="추정 결과"><div class="metric"><strong>OLS 기울기</strong><span id="ols"></span></div><div class="metric"><strong>2SLS 기울기</strong><span id="iv"></span></div><div class="metric"><strong>첫 단계 F</strong><span id="fstat"></span></div><div class="metric"><strong>MC 2SLS 중앙값</strong><span id="median"></span></div></section>
  <section class="charts"><figure><canvas id="first" width="620" height="360" aria-label="도구변수와 설명변수의 첫 단계 산점도"></canvas><figcaption>도구 강도 pi가 작으면 z와 x의 선형 연결이 약해집니다.</figcaption></figure><figure><canvas id="dist" width="620" height="360" aria-label="OLS와 2SLS 기울기 추정치의 표본분포"></canvas><figcaption>중앙 98% 범위만 표시합니다. 약한 도구변수에서는 바깥 꼬리가 더 클 수 있습니다.</figcaption></figure></section>
  <p class="formula">x = pi z + v, &nbsp; y = beta x + u, &nbsp; u = rho v + √(1 − rho²)e</p>
  <script>
    const $=id=>document.getElementById(id), inputs=['n','beta','pi','rho'].map($), fmt=x=>Number(x).toFixed(3);
    function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
    function normal(r){return Math.sqrt(-2*Math.log(Math.max(r(),1e-12)))*Math.cos(2*Math.PI*r())}
    function slope(a,b){let ma=a.reduce((q,v)=>q+v,0)/a.length,mb=b.reduce((q,v)=>q+v,0)/b.length,num=0,den=0;for(let i=0;i<a.length;i++){num+=(a[i]-ma)*(b[i]-mb);den+=(a[i]-ma)**2}return num/den}
    function ivSlope(z,x,y){let mz=z.reduce((q,v)=>q+v,0)/z.length,mx=x.reduce((q,v)=>q+v,0)/x.length,my=y.reduce((q,v)=>q+v,0)/y.length,num=0,den=0;for(let i=0;i<z.length;i++){num+=(z[i]-mz)*(y[i]-my);den+=(z[i]-mz)*(x[i]-mx)}return num/den}
    function firstF(z,x){let b=slope(z,x),mz=z.reduce((q,v)=>q+v,0)/z.length,mx=x.reduce((q,v)=>q+v,0)/x.length,ess=0,rss=0;for(let i=0;i<z.length;i++){let fit=mx+b*(z[i]-mz);ess+=(fit-mx)**2;rss+=(x[i]-fit)**2}return ess/(rss/(z.length-2))}
    function axes(ctx,w,h,x0,x1,y0,y1){const p={l:48,r:14,t:27,b:36},sx=x=>p.l+(x-x0)/(x1-x0)*(w-p.l-p.r),sy=y=>h-p.b-(y-y0)/(y1-y0)*(h-p.t-p.b);ctx.clearRect(0,0,w,h);ctx.strokeStyle='#b9a894';ctx.beginPath();ctx.moveTo(p.l,p.t);ctx.lineTo(p.l,h-p.b);ctx.lineTo(w-p.r,h-p.b);ctx.stroke();ctx.fillStyle='#725f54';ctx.font='12px system-ui';ctx.fillText(x0.toFixed(1),p.l-8,h-17);ctx.fillText(x1.toFixed(1),w-p.r-22,h-17);ctx.fillText(y0.toFixed(1),5,h-p.b+4);ctx.fillText(y1.toFixed(1),5,p.t+4);return{sx,sy,p}}
    function firstChart(z,x,pi){let c=$('first'),ctx=c.getContext('2d'),x0=Math.min(...z)-.3,x1=Math.max(...z)+.3,y0=Math.min(...x)-.4,y1=Math.max(...x)+.4,a=axes(ctx,c.width,c.height,x0,x1,y0,y1),b=slope(z,x),mz=z.reduce((q,v)=>q+v,0)/z.length,mx=x.reduce((q,v)=>q+v,0)/x.length;ctx.strokeStyle='#493a31';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(a.sx(x0),a.sy(mx+b*(x0-mz)));ctx.lineTo(a.sx(x1),a.sy(mx+b*(x1-mz)));ctx.stroke();ctx.fillStyle='#954f2d';for(let i=0;i<z.length;i++){ctx.beginPath();ctx.arc(a.sx(z[i]),a.sy(x[i]),3,0,2*Math.PI);ctx.fill()}ctx.fillStyle='#493a31';ctx.font='bold 13px system-ui';ctx.fillText(`first-stage pi hat = ${fmt(b)} | true pi = ${pi.toFixed(2)}`,55,18)}
    function quantile(a,p){let b=[...a].sort((x,y)=>x-y),i=(b.length-1)*p,lo=Math.floor(i),hi=Math.ceil(i);return b[lo]+(b[hi]-b[lo])*(i-lo)}
    function distribution(ols,iv,beta){let c=$('dist'),ctx=c.getContext('2d'),all=[...ols,...iv],lo=quantile(all,.01),hi=quantile(all,.99);lo=Math.min(lo,beta)-.08;hi=Math.max(hi,beta)+.08;let bins=28,co=Array(bins).fill(0),ci=Array(bins).fill(0),add=(arr,out)=>arr.forEach(v=>{if(v>=lo&&v<=hi)out[Math.min(bins-1,Math.floor((v-lo)/(hi-lo)*bins))]++});add(ols,co);add(iv,ci);let max=Math.max(...co,...ci)*1.18,a=axes(ctx,c.width,c.height,lo,hi,0,max);for(let i=0;i<bins;i++){let xl=lo+i*(hi-lo)/bins,xr=lo+(i+1)*(hi-lo)/bins,w=a.sx(xr)-a.sx(xl);ctx.fillStyle='rgba(149,79,45,.60)';ctx.fillRect(a.sx(xl)+1,a.sy(co[i]),w-2,a.sy(0)-a.sy(co[i]));ctx.fillStyle='rgba(114,91,112,.48)';ctx.fillRect(a.sx(xl)+1,a.sy(ci[i]),w-2,a.sy(0)-a.sy(ci[i]))}ctx.strokeStyle='#493a31';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(a.sx(beta),a.sy(0));ctx.lineTo(a.sx(beta),a.sy(max));ctx.stroke();ctx.fillStyle='#493a31';ctx.font='bold 13px system-ui';ctx.fillText('OLS',55,18);ctx.fillStyle='#725b70';ctx.fillText('2SLS',94,18);ctx.fillStyle='#493a31';ctx.fillText('| true beta',140,18)}
    function update(){let n=+$('n').value,beta=+$('beta').value,pi=+$('pi').value,rho=+$('rho').value;$('n-value').textContent=n;$('beta-value').textContent=beta.toFixed(1);$('pi-value').textContent=pi.toFixed(2);$('rho-value').textContent=rho.toFixed(1);let r=rng(20260917+n*29+Math.round(pi*100)*17+Math.round(rho*100)*11),make=()=>{let z=[],x=[],y=[];for(let i=0;i<n;i++){let zi=normal(r),v=normal(r),e=normal(r);z.push(zi);x.push(pi*zi+v);y.push(beta*x[i]+rho*v+Math.sqrt(1-rho*rho)*e)}return{z,x,y}},d=make(),ols=[],iv=[];for(let j=0;j<800;j++){let q=make();ols.push(slope(q.x,q.y));iv.push(ivSlope(q.z,q.x,q.y))}$('ols').textContent=fmt(slope(d.x,d.y));$('iv').textContent=fmt(ivSlope(d.z,d.x,d.y));$('fstat').textContent=fmt(firstF(d.z,d.x));$('median').textContent=fmt(quantile(iv,.5));firstChart(d.z,d.x,pi);distribution(ols,iv,beta)}inputs.forEach(x=>x.addEventListener('input',update));update();
  </script>
</body></html>
