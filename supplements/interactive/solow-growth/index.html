<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solow 성장모형 전이경로</title>
  <style>
    :root { --ink:#17212b; --muted:#56636b; --line:#d7dfe2; --teal:#087e8b; --gold:#a16207; --paper:#fbfcfc; --surface:#fff; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { max-width:1000px; margin:auto; padding:1.25rem; }
    h1 { margin:0 0 .25rem; font-size:1.45rem; }
    .lead { margin:.1rem 0 1.1rem; color:var(--muted); }
    .layout { display:grid; grid-template-columns:minmax(225px,.9fr) minmax(0,1.5fr); gap:1rem; align-items:start; }
    .panel,.chart-card { background:var(--surface); border:1px solid var(--line); border-radius:.7rem; padding:1rem; }
    fieldset { border:0; padding:0; margin:0; }
    legend { margin-bottom:.5rem; font-weight:700; }
    label { display:grid; grid-template-columns:1fr auto; gap:.5rem; margin:.8rem 0; font-weight:650; }
    output { color:var(--teal); font-variant-numeric:tabular-nums; }
    input[type="range"] { grid-column:1 / -1; width:100%; accent-color:var(--teal); }
    .range-ends { display:flex; justify-content:space-between; color:var(--muted); font-size:.8rem; margin-top:-.55rem; }
    svg { display:block; width:100%; height:auto; }
    .axis { stroke:var(--ink); } .transition { fill:none; stroke:var(--teal); } .steady { stroke:var(--gold); stroke-dasharray:8 6; }
    .label { fill:var(--ink); font-size:13px; } .muted { fill:var(--muted); font-size:12px; }
    .summary { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:.55rem; margin-top:.8rem; }
    .metric { border-radius:.45rem; background:#f4f8f8; padding:.65rem; }
    .metric strong { display:block; color:var(--muted); font-size:.82rem; }
    .formula { margin:.85rem 0 0; border-left:4px solid var(--teal); background:#eef9f8; padding:.75rem; font-size:.93rem; }
    .error { color:#9f2b27; } .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @media (max-width:700px) { main { padding:.8rem; } .layout { grid-template-columns:1fr; } .summary { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>Solow 성장모형: 전이경로 탐색</h1>
    <p class="lead">R이 생성한 모수 격자에서 저축률, 감가상각률, 초기 자본을 고르면 효율노동 단위 자본의 경로가 바뀝니다.</p>
    <div class="layout">
      <section class="panel" aria-label="모수 선택">
        <fieldset>
          <legend>모수</legend>
          <label for="saving">저축률 s <output id="savingOut"></output><input id="saving" type="range" value="0"></label>
          <div class="range-ends"><span>낮음</span><span>높음</span></div>
          <label for="depreciation">감가상각률 δ <output id="depreciationOut"></output><input id="depreciation" type="range" value="0"></label>
          <div class="range-ends"><span>낮음</span><span>높음</span></div>
          <label for="capital">초기 자본 k₀ <output id="capitalOut"></output><input id="capital" type="range" value="0"></label>
          <div class="range-ends"><span>낮음</span><span>높음</span></div>
        </fieldset>
        <p class="formula" id="formula">데이터를 불러오는 중입니다.</p>
      </section>
      <section class="chart-card" aria-label="자본 전이경로">
        <svg id="chart" viewBox="0 0 590 410" role="img" aria-labelledby="chartTitle chartDesc">
          <title id="chartTitle">Solow 모형의 자본 전이경로</title>
          <desc id="chartDesc">선택한 모수 아래 효율노동 단위 자본과 정상상태 자본을 보인다.</desc>
          <g class="axis" stroke-width="2"><line x1="58" y1="344" x2="556" y2="344"/><line x1="58" y1="344" x2="58" y2="28"/></g>
          <line id="steady" class="steady" stroke-width="2.5"/>
          <path id="transition" class="transition" stroke-width="3"/>
          <g id="ticks" class="muted"></g>
          <g class="label"><text x="544" y="372">t</text><text x="20" y="36">k</text><text x="49" y="367">0</text></g>
          <text id="steadyLabel" class="label" fill="#a16207"></text>
        </svg>
        <div class="summary" aria-label="계산 결과">
          <div class="metric"><strong>정상상태 자본 k*</strong><span id="kStar"></span></div>
          <div class="metric"><strong>정상상태 산출 y*</strong><span id="yStar"></span></div>
          <div class="metric"><strong>정상상태 소비 c*</strong><span id="cStar"></span></div>
          <div class="metric"><strong>40기 자본 k₄₀</strong><span id="kEnd"></span></div>
        </div>
        <p id="status" class="sr-only" aria-live="polite"></p>
      </section>
    </div>
  </main>
  <script>
    (() => {
      const $ = id => document.getElementById(id);
      const els = { saving:$("saving"), depreciation:$("depreciation"), capital:$("capital"), savingOut:$("savingOut"), depreciationOut:$("depreciationOut"), capitalOut:$("capitalOut"), formula:$("formula"), transition:$("transition"), steady:$("steady"), steadyLabel:$("steadyLabel"), ticks:$("ticks"), kStar:$("kStar"), yStar:$("yStar"), cStar:$("cStar"), kEnd:$("kEnd"), status:$("status") };
      const fmt = value => Number(value).toFixed(3);
      const chooseIndex = (values, target) => Math.max(0, values.findIndex(value => Math.abs(value - target) < 1e-8));
      let data;

      function selected(values, input) { return values[Number(input.value)]; }
      function scenarioFor(s, delta, k0) {
        return data.scenarios.find(item => Math.abs(item.parameters.s-s) < 1e-8 && Math.abs(item.parameters.delta-delta) < 1e-8 && Math.abs(item.parameters.k0-k0) < 1e-8);
      }
      function render() {
        const s = selected(data.values.s, els.saving);
        const delta = selected(data.values.delta, els.depreciation);
        const k0 = selected(data.values.k0, els.capital);
        const item = scenarioFor(s, delta, k0);
        if (!item) throw new Error("선택한 모수의 R 시나리오를 찾을 수 없습니다.");
        const path = item.path;
        const kMax = Math.max(item.steady_state.k, ...path.map(point => point.k)) * 1.12;
        const x = point => 58 + 486 * point.t / data.model.horizon;
        const y = value => 344 - 286 * value / kMax;
        els.transition.setAttribute("d", path.map((point, index) => (index ? "L" : "M") + x(point).toFixed(2) + " " + y(point.k).toFixed(2)).join(" "));
        const steadyY = y(item.steady_state.k);
        els.steady.setAttribute("x1", "58"); els.steady.setAttribute("x2", "544"); els.steady.setAttribute("y1", steadyY); els.steady.setAttribute("y2", steadyY);
        els.steadyLabel.setAttribute("x", "424"); els.steadyLabel.setAttribute("y", Math.max(44, steadyY - 8)); els.steadyLabel.textContent = "정상상태 k*";
        els.ticks.innerHTML = [0, 10, 20, 30, 40].map(t => '<text x="'+(x({t}).toFixed(1))+'" y="361" text-anchor="middle">'+t+'</text>').join("") + '<text x="49" y="'+(steadyY+4).toFixed(1)+'" text-anchor="end">k*</text>';
        els.savingOut.value = fmt(s); els.depreciationOut.value = fmt(delta); els.capitalOut.value = fmt(k0);
        els.kStar.textContent = fmt(item.steady_state.k); els.yStar.textContent = fmt(item.steady_state.y); els.cStar.textContent = fmt(item.steady_state.c); els.kEnd.textContent = fmt(path[path.length-1].k);
        els.formula.textContent = "kₜ₊₁ = ((1 − δ)kₜ + s·kₜ^α) / ((1+n)(1+g)); α="+data.model.alpha+", n="+data.model.n+", g="+data.model.g+".";
        els.status.textContent = "저축률 "+fmt(s)+", 감가상각률 "+fmt(delta)+", 초기 자본 "+fmt(k0)+"에서 정상상태 자본은 "+fmt(item.steady_state.k)+"입니다.";
      }
      async function start() {
        try {
          const response = await fetch("../../../assets/data/solow-growth-scenarios.json");
          if (!response.ok) throw new Error("시나리오 데이터를 불러오지 못했습니다.");
          data = await response.json();
          [[els.saving, data.values.s, data.defaults.s], [els.depreciation, data.values.delta, data.defaults.delta], [els.capital, data.values.k0, data.defaults.k0]].forEach(([input, values, defaultValue]) => {
            input.max = String(values.length - 1); input.step = "1"; input.value = String(chooseIndex(values, defaultValue)); input.addEventListener("input", render);
          });
          render();
        } catch (error) {
          els.formula.textContent = "R 시나리오 데이터를 불러오지 못했습니다. 설명 페이지의 정적 그림을 이용해 주세요.";
          els.formula.classList.add("error");
          els.status.textContent = els.formula.textContent;
        }
      }
      start();
    })();
  </script>
</body>
</html>
