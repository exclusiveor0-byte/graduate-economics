<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OLS 표본 기하와 표본 변동</title>
  <style>
    :root { --ink:#3f3129; --muted:#725f54; --paper:#fffaf2; --panel:#f5eadc; --rule:#dfcdb8; --accent:#954f2d; --plum:#725b70; }
    * { box-sizing:border-box; } body { margin:0; padding:1rem; background:var(--paper); color:var(--ink); font:16px/1.55 system-ui,"Noto Sans KR",sans-serif; }
    h1 { margin:0; font:600 1.3rem Georgia,"Noto Serif KR",serif; } .lede { margin:.3rem 0 .8rem; color:var(--muted); font-size:.9rem; }
    .controls,.metrics,.charts { display:grid; gap:.7rem; } .controls,.metrics { grid-template-columns:repeat(4,minmax(0,1fr)); } .controls { padding:.85rem; border:1px solid var(--rule); background:var(--panel); }
    label { display:grid; gap:.2rem; font-size:.77rem; font-weight:700; } output { color:var(--accent); font-variant-numeric:tabular-nums; } input { width:100%; accent-color:var(--accent); }
    .metrics { margin:.8rem 0; } .metric { padding:.65rem; border-top:3px solid var(--plum); background:#f5eef3; } .metric strong { display:block; color:var(--plum); font-size:.7rem; } .metric span { display:block; margin-top:.2rem; font-size:1.04rem; font-variant-numeric:tabular-nums; }
    .charts { grid-template-columns:1fr 1fr; } figure { margin:0; padding:.6rem; border:1px solid var(--rule); background:#fffdf9; } canvas { display:block; width:100%; height:auto; } figcaption { margin:.3rem .1rem 0; color:var(--muted); font-size:.74rem; }
    .formula { margin:.8rem 0 0; padding:.65rem .8rem; border-left:3px solid var(--accent); background:#f8efe5; font-family:Georgia,serif; }
    @media (max-width:720px) { body { padding:.7rem; } .controls,.metrics { grid-template-columns:1fr 1fr; } .charts { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <h1>OLS 표본 기하와 표본 변동</h1>
  <p class="lede">표본을 다시 만들고, 고정된 설명변수 아래에서 회귀계수의 표본분포를 확인하세요.</p>
  <section class="controls" aria-label="모수 조절">
    <label>표본 수 n <output id="n-value"></output><input id="n" type="range" min="20" max="120" step="5" value="40"></label>
    <label>기울기 beta <output id="beta-value"></output><input id="beta" type="range" min="0.4" max="2.4" step="0.1" value="1.4"></label>
    <label>오차 표준편차 sigma <output id="sigma-value"></output><input id="sigma" type="range" min="0.2" max="2" step="0.1" value="0.8"></label>
    <label>Monte Carlo 반복 <output id="reps-value"></output><input id="reps" type="range" min="200" max="2000" step="100" value="1000"></label>
  </section>
  <section class="metrics" aria-label="OLS 결과">
    <div class="metric"><strong>beta hat</strong><span id="beta-hat"></span></div>
    <div class="metric"><strong>OLS 표준오차</strong><span id="se"></span></div>
    <div class="metric"><strong>Monte Carlo 평균</strong><span id="mc-mean"></span></div>
    <div class="metric"><strong>max |X' uhat|</strong><span id="orthogonality"></span></div>
  </section>
  <section class="charts">
    <figure><canvas id="scatter" width="620" height="360" aria-label="표본 산점도와 OLS 적합선"></canvas><figcaption>각 세로선은 잔차 uhat_i입니다. OLS에서는 X' uhat = 0입니다.</figcaption></figure>
    <figure><canvas id="histogram" width="620" height="360" aria-label="OLS 기울기 추정치의 표본분포"></canvas><figcaption>설명변수 x를 고정하고 오차만 반복 추출한 beta hat의 분포입니다.</figcaption></figure>
  </section>
  <p class="formula">y = X beta + u, &nbsp; beta hat = (X'X)<sup>−1</sup>X'y, &nbsp; y = yhat + uhat</p>
  <script>
    const inputs = ['n','beta','sigma','reps'].map(id => document.getElementById(id));
    const fmt = x => Number(x).toFixed(3);
    function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
    function normal(r) { return Math.sqrt(-2*Math.log(Math.max(r(),1e-12)))*Math.cos(2*Math.PI*r()); }
    function fit(x,y) { const n=x.length,mx=x.reduce((a,b)=>a+b,0)/n,my=y.reduce((a,b)=>a+b,0)/n; let sxx=0,sxy=0; for(let i=0;i<n;i++){sxx+=(x[i]-mx)**2;sxy+=(x[i]-mx)*(y[i]-my);} const b=sxy/sxx,a=my-b*mx,u=y.map((v,i)=>v-a-b*x[i]),sse=u.reduce((q,v)=>q+v*v,0); return {a,b,u,se:Math.sqrt(sse/(n-2)/sxx),ortho:Math.max(Math.abs(u.reduce((q,v)=>q+v,0)),Math.abs(u.reduce((q,v,i)=>q+x[i]*v,0)))}; }
    function axes(ctx,w,h,x0,x1,y0,y1) { const p={l:48,r:14,t:27,b:36},sx=x=>p.l+(x-x0)/(x1-x0)*(w-p.l-p.r),sy=y=>h-p.b-(y-y0)/(y1-y0)*(h-p.t-p.b); ctx.clearRect(0,0,w,h);ctx.strokeStyle='#b9a894';ctx.beginPath();ctx.moveTo(p.l,p.t);ctx.lineTo(p.l,h-p.b);ctx.lineTo(w-p.r,h-p.b);ctx.stroke();ctx.fillStyle='#725f54';ctx.font='12px system-ui';ctx.fillText(x0.toFixed(1),p.l-8,h-17);ctx.fillText(x1.toFixed(1),w-p.r-22,h-17);ctx.fillText(y0.toFixed(1),5,h-p.b+4);ctx.fillText(y1.toFixed(1),5,p.t+4);return {sx,sy}; }
    function scatter(x,y,r,beta) { const c=document.getElementById('scatter'),ctx=c.getContext('2d'),x0=Math.min(...x)-.3,x1=Math.max(...x)+.3,y0=Math.min(...y,0)-.6,y1=Math.max(...y)-Math.min(...y,0)+.6,a=axes(ctx,c.width,c.height,x0,x1,y0,y1);ctx.strokeStyle='rgba(149,79,45,.35)';for(let i=0;i<x.length;i++){ctx.beginPath();ctx.moveTo(a.sx(x[i]),a.sy(y[i]));ctx.lineTo(a.sx(x[i]),a.sy(r.a+r.b*x[i]));ctx.stroke();}ctx.strokeStyle='#493a31';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(a.sx(x0),a.sy(r.a+r.b*x0));ctx.lineTo(a.sx(x1),a.sy(r.a+r.b*x1));ctx.stroke();ctx.fillStyle='#954f2d';for(let i=0;i<x.length;i++){ctx.beginPath();ctx.arc(a.sx(x[i]),a.sy(y[i]),3,0,2*Math.PI);ctx.fill();}ctx.fillStyle='#493a31';ctx.font='bold 13px system-ui';ctx.fillText(`OLS slope = ${fmt(r.b)} | true beta = ${fmt(beta)}`,55,18); }
    function histogram(draws,beta) { const c=document.getElementById('histogram'),ctx=c.getContext('2d'),lo=Math.min(...draws,beta)-.12,hi=Math.max(...draws,beta)+.12,bins=24,count=Array(bins).fill(0);draws.forEach(v=>count[Math.max(0,Math.min(bins-1,Math.floor((v-lo)/(hi-lo)*bins)))]++);const max=Math.max(...count)*1.15,a=axes(ctx,c.width,c.height,lo,hi,0,max);ctx.fillStyle='#b79bad';count.forEach((v,i)=>{const xl=lo+i*(hi-lo)/bins,xr=lo+(i+1)*(hi-lo)/bins;ctx.fillRect(a.sx(xl)+1,a.sy(v),a.sx(xr)-a.sx(xl)-2,a.sy(0)-a.sy(v));});ctx.strokeStyle='#954f2d';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(a.sx(beta),a.sy(0));ctx.lineTo(a.sx(beta),a.sy(max));ctx.stroke();ctx.fillStyle='#493a31';ctx.font='bold 13px system-ui';ctx.fillText('fixed-X sampling distribution of beta hat',55,18); }
    function update() { const n=+nInput.value,beta=+betaInput.value,sigma=+sigmaInput.value,reps=+repsInput.value; nValue.textContent=n;betaValue.textContent=beta.toFixed(1);sigmaValue.textContent=sigma.toFixed(1);repsValue.textContent=reps;const random=rng(20260916+n*31+Math.round(beta*100)*17+Math.round(sigma*100));const x=Array.from({length:n},(_,i)=>-2+4*i/(n-1)+.15*normal(random)),y=x.map(v=>1+beta*v+sigma*normal(random)),r=fit(x,y),draws=Array.from({length:reps},()=>fit(x,x.map(v=>1+beta*v+sigma*normal(random))).b);betaHat.textContent=fmt(r.b);se.textContent=fmt(r.se);mcMean.textContent=fmt(draws.reduce((a,b)=>a+b,0)/reps);orthogonality.textContent=r.ortho.toExponential(1);scatter(x,y,r,beta);histogram(draws,beta); }
    const [nInput,betaInput,sigmaInput,repsInput]=inputs, nValue=document.getElementById('n-value'), betaValue=document.getElementById('beta-value'), sigmaValue=document.getElementById('sigma-value'), repsValue=document.getElementById('reps-value'), betaHat=document.getElementById('beta-hat'), se=document.getElementById('se'), mcMean=document.getElementById('mc-mean'), orthogonality=document.getElementById('orthogonality'); inputs.forEach(x=>x.addEventListener('input',update)); update();
  </script>
</body>
</html>
