name: Quarto Render Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Quarto Render Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.10.18'

      - name: Render book
        run: quarto render

      - name: Check pages, links, and callouts
        run: python3 scripts/check_render.py

      - name: Save review copy
        uses: actions/upload-artifact@v7
        with:
          name: book-preview
          path: _book
          retention-days: 7
          if-no-files-found: error
