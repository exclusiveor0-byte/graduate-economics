format:
  html:
    theme:
    - cosmo
    - styles/notes.scss
    toc: true
    toc-title: 이 페이지에서
    grid:
      sidebar-width: 280px
      body-width: 820px
      margin-width: 220px
      gutter-width: 1.5rem
    callout-icon: false
    code-copy: true
    code-fold: true
    code-summary: Code
    smooth-scroll: false
    html-math-method: mathjax
    include-after-body: styles/reading.html
