project:
  type: book
  output-dir: _book
  resources:
    - assets/**
    - supplements/interactive/**
    - supplements/r/**
    - supplements/matlab/**
lang: ko
bibliography: references.bib
number-sections: false
toc-depth: 3
book:
  site-url: https://exclusiveor0-byte.github.io/graduate-economics/
  repo-url: https://github.com/exclusiveor0-byte/graduate-economics
  repo-branch: main
  repo-actions: [edit, issue]
  title: 대학원 경제학 정리노트
  subtitle: Graduate Economics Knowledge Base
  page-navigation: true
  search: true
  sidebar:
    title: Economics Notes
    style: docked
    collapse-level: 1
  chapters:
  - index.qmd
  - collaboration.qmd
  - microeconomics/index.qmd
