<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Slutsky와 Hicks 보상의 정적 비교</title>
  <desc id="desc">같은 초기 가격, 소득, 선호에서 Slutsky 보상과 Hicks 보상을 나란히 보인다. 왼쪽 Slutsky 보상선은 초기 묶음을 지나며, 오른쪽 Hicks 보상 수요는 초기 무차별곡선 위에 있다.</desc>
  <rect width="1120" height="560" fill="#ffffff"/>
  <g font-family="Arial, 'Malgun Gothic', sans-serif" fill="#17212b">
    <text x="560" y="38" text-anchor="middle" font-size="25" font-weight="700">가격 상승 뒤 두 보상 규칙의 비교</text>
    <text x="560" y="64" text-anchor="middle" font-size="16" fill="#56636b">기본 설정: p₁: 1 → 1.5, p₂=1, m=100, α=0.5</text>
  </g>
  <g stroke="#d7dfe2" stroke-width="1">
    <line x1="70" y1="345" x2="445" y2="345"/><line x1="70" y1="220" x2="445" y2="220"/><line x1="70" y1="95" x2="445" y2="95"/>
    <line x1="620" y1="345" x2="995" y2="345"/><line x1="620" y1="220" x2="995" y2="220"/><line x1="620" y1="95" x2="995" y2="95"/>
  </g>
  <g stroke="#263238" stroke-width="2">
    <line x1="70" y1="470" x2="445" y2="470"/><line x1="70" y1="470" x2="70" y2="95"/>
    <line x1="620" y1="470" x2="995" y2="470"/><line x1="620" y1="470" x2="620" y2="95"/>
  </g>
  <g font-family="Arial, 'Malgun Gothic', sans-serif" font-size="15" fill="#56636b">
    <text x="70" y="492" text-anchor="middle">0</text><text x="195" y="492" text-anchor="middle">50</text><text x="320" y="492" text-anchor="middle">100</text><text x="445" y="492" text-anchor="middle">150</text>
    <text x="620" y="492" text-anchor="middle">0</text><text x="745" y="492" text-anchor="middle">50</text><text x="870" y="492" text-anchor="middle">100</text><text x="995" y="492" text-anchor="middle">150</text>
    <text x="59" y="349" text-anchor="end">50</text><text x="59" y="224" text-anchor="end">100</text><text x="59" y="99" text-anchor="end">150</text>
    <text x="609" y="349" text-anchor="end">50</text><text x="609" y="224" text-anchor="end">100</text><text x="609" y="99" text-anchor="end">150</text>
  </g>
  <g font-family="Arial, 'Malgun Gothic', sans-serif" fill="#17212b">
    <text x="258" y="88" text-anchor="middle" font-size="21" font-weight="700">Slutsky 보상</text>
    <text x="808" y="88" text-anchor="middle" font-size="21" font-weight="700">Hicks 보상</text>
    <text x="452" y="462" font-size="17">x₁</text><text x="42" y="82" font-size="17">x₂</text>
    <text x="1002" y="462" font-size="17">x₁</text><text x="592" y="82" font-size="17">x₂</text>
  </g>
  <path d="M112 95 C129 156 151 229 195 345 C224 403 279 442 382 454" fill="none" stroke="#a16207" stroke-width="2.5" stroke-dasharray="7 7"/>
  <path d="M662 95 C679 156 701 229 745 345 C774 403 829 442 932 454" fill="none" stroke="#a16207" stroke-width="2.5" stroke-dasharray="7 7"/>
  <line x1="70" y1="220" x2="320" y2="470" stroke="#69757a" stroke-width="3"/>
  <line x1="70" y1="220" x2="236.67" y2="470" stroke="#c2413b" stroke-width="3"/>
  <line x1="70" y1="157.5" x2="278.33" y2="470" stroke="#087e8b" stroke-width="3" stroke-dasharray="10 7"/>
  <line x1="620" y1="220" x2="870" y2="470" stroke="#69757a" stroke-width="3"/>
  <line x1="620" y1="220" x2="786.67" y2="470" stroke="#c2413b" stroke-width="3"/>
  <line x1="620" y1="163.81" x2="824.13" y2="470" stroke="#087e8b" stroke-width="3" stroke-dasharray="10 7"/>
  <g font-family="Arial, 'Malgun Gothic', sans-serif" font-size="15">
    <text x="285" y="447" fill="#69757a">초기 예산선</text><text x="118" y="145" fill="#087e8b">초기 묶음을 지나는 보상선</text><text x="100" y="260" fill="#c2413b">새 예산선</text>
    <text x="835" y="447" fill="#69757a">초기 예산선</text><text x="656" y="151" fill="#087e8b">초기 효용을 유지하는 보상선</text><text x="650" y="260" fill="#c2413b">새 예산선</text>
  </g>
  <g font-family="Arial, 'Malgun Gothic', sans-serif" font-size="16">
    <circle cx="195" cy="345" r="7" fill="#17212b"/><text x="207" y="338" fill="#17212b">초기 x⁰</text>
    <circle cx="174.17" cy="313.75" r="7" fill="#087e8b"/><text x="186" y="307" fill="#087e8b">보상 xᶜ</text>
    <circle cx="153.33" cy="345" r="7" fill="#c2413b"/><text x="100" y="370" fill="#c2413b">실제 x¹</text>
    <circle cx="745" cy="345" r="7" fill="#17212b"/><text x="757" y="338" fill="#17212b">초기 x⁰</text>
    <circle cx="722.06" cy="316.91" r="7" fill="#087e8b"/><text x="734" y="310" fill="#087e8b">보상 xᶜ</text>
    <circle cx="703.33" cy="345" r="7" fill="#c2413b"/><text x="650" y="370" fill="#c2413b">실제 x¹</text>
  </g>
  <g font-family="Arial, 'Malgun Gothic', sans-serif" font-size="15" fill="#56636b">
    <text x="257" y="525" text-anchor="middle">청록 보상선은 초기 묶음 x⁰을 통과한다.</text>
    <text x="807" y="525" text-anchor="middle">청록 보상점 xᶜ는 초기 무차별곡선 위에 있다.</text>
  </g>
</svg>
