<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="title desc">
  <title id="title">Slutsky 분해의 정적 예산선 그림</title>
  <desc id="desc">초기 예산선, 가격 변화 뒤 예산선, Slutsky 보상 예산선과 초기, 보상, 실제 수요점</desc>
  <rect width="720" height="500" fill="#ffffff"/>
  <g stroke="#263238" stroke-width="2"><line x1="84" y1="420" x2="656" y2="420"/><line x1="84" y1="420" x2="84" y2="52"/></g>
  <g font-family="Arial, sans-serif" font-size="18" fill="#263238"><text x="648" y="452">x₁</text><text x="43" y="64">x₂</text><text x="81" y="448">0</text></g>
  <line x1="84" y1="140" x2="464" y2="420" stroke="#69757a" stroke-width="3"/>
  <line x1="84" y1="70" x2="401" y2="420" stroke="#0f766e" stroke-width="3" stroke-dasharray="10 7"/>
  <line x1="84" y1="140" x2="337" y2="420" stroke="#c2413b" stroke-width="3"/>
  <path d="M179 140 C218 214 252 261 274 280 C311 310 350 325 388 332" fill="none" stroke="#b7791f" stroke-width="2.5" stroke-dasharray="7 7"/>
  <g fill="#17212b"><circle cx="274" cy="280" r="7"/><text x="286" y="274" font-family="Arial, sans-serif" font-size="17">초기 수요 x⁰</text></g>
  <g fill="#0f766e"><circle cx="242" cy="245" r="7"/><text x="254" y="239" font-family="Arial, sans-serif" font-size="17">보상 수요 xᶜ</text></g>
  <g fill="#c2413b"><circle cx="211" cy="280" r="7"/><text x="132" y="302" font-family="Arial, sans-serif" font-size="17">실제 수요 x¹</text></g>
  <g font-family="Arial, sans-serif" font-size="16"><text x="392" y="335" fill="#69757a">초기 예산선</text><text x="122" y="100" fill="#0f766e">Slutsky 보상선</text><text x="115" y="190" fill="#c2413b">새 예산선</text><text x="382" y="286" fill="#9a6700">초기 무차별곡선</text></g>
</svg>
