<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">Edgeworth 상자에서 경쟁균형과 계약곡선</title>
  <desc id="desc">초기부존에서 통과하는 경쟁예산선 위의 경쟁균형이 계약곡선 위에 놓여 있다.</desc>
  <rect width="760" height="520" fill="#fffaf2"/>
  <rect x="110" y="80" width="520" height="350" fill="#fffdf9" stroke="#4b3a31" stroke-width="2"/>
  <polyline points="110,430 162,419 214,406 266,391 318,373 370,351 422,324 448,308 474,289 526,242 578,177 630,80" fill="none" stroke="#087e8b" stroke-width="5"/>
  <path d="M110 80 L630 430" fill="none" stroke="#8c786a" stroke-width="3" stroke-dasharray="9 7"/>
  <circle cx="292" cy="203" r="8" fill="#9b5c39"/><text x="304" y="194" font-family="system-ui,sans-serif" font-size="18" fill="#5d4435">초기부존 e</text>
  <circle cx="448" cy="307" r="9" fill="#725b70"/><text x="461" y="299" font-family="system-ui,sans-serif" font-size="18" fill="#463745">경쟁균형 x*</text>
  <text x="421" y="226" font-family="system-ui,sans-serif" font-size="18" fill="#087e8b">계약곡선</text>
  <text x="340" y="266" font-family="system-ui,sans-serif" font-size="16" fill="#725f54">공통 예산선</text>
  <text x="110" y="463" font-family="system-ui,sans-serif" font-size="18" fill="#4b3a31">A의 x</text><text x="78" y="85" font-family="system-ui,sans-serif" font-size="18" fill="#4b3a31">A의 y</text>
  <text x="612" y="463" font-family="system-ui,sans-serif" font-size="18" fill="#4b3a31">B의 x</text><text x="640" y="85" font-family="system-ui,sans-serif" font-size="18" fill="#4b3a31">B의 y</text>
  <text x="110" y="48" font-family="Georgia,serif" font-size="25" fill="#3f3129">경쟁균형은 계약곡선 위에 놓인다</text>
</svg>
